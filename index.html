<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phaco Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <!-- LOGIN -->
  <section id="login" hidden>
    <div class="login-card">
      <div class="logo">◉ Phaco Academy</div>
      <p class="muted">Phacoemulsification machine training · 1-day course</p>
      <form id="loginForm">
        <label>Username<input id="u" autocomplete="username" required></label>
        <label>Password<input id="p" type="password" autocomplete="current-password" required></label>
        <button class="btn big" id="loginBtn">Sign in</button>
        <div id="loginErr" class="err"></div>
      </form>
      <p id="demoNote" class="small muted" hidden>Demo mode (no Google Sheet linked): <b>demo / phaco123</b></p>
    </div>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <header>
      <div class="logo">◉ Phaco Academy</div>
      <nav id="nav">
        <button data-v="home">Home</button>
        <button data-v="lesson">Lessons</button>
        <button data-v="explore">3D Lab</button>
        <button data-v="sim">Simulator</button>
      </nav>
      <div class="user"><span id="who"></span><button class="btn ghost sm" id="logout">Log out</button></div>
    </header>

    <main>
      <section id="v-home" class="view"></section>
      <section id="v-lesson" class="view" hidden></section>
      <section id="v-explore" class="view" hidden></section>
      <section id="v-sim" class="view" hidden></section>

      <div id="stage3d" hidden>
        <div id="viewWrap">
          <div id="viewport"></div>
          <div id="hoverTip" hidden></div>
          <div class="toolbar">
            <label>Explode <input type="range" id="explode" min="0" max="100" value="0"></label>
            <button class="btn sm" id="xray">X-ray</button>
            <button class="btn sm ghost" id="isoHP">Handpiece only</button>
            <button class="btn sm ghost" id="showAll">Show all</button>
            <button class="btn sm ghost" id="resetView">Reset</button>
          </div>
          <div id="partInfo" class="card" hidden></div>
        </div>
        <aside id="sidePanel" class="card">
          <div id="lessonBox"></div>
          <div id="partsList" hidden></div>
        </aside>
        <div id="simPanel" hidden></div>
      </div>
    </main>
  </div>
  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
